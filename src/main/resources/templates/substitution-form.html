<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROT13 Encoder</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/script.js}" defer></script>
</head>
<body>
    <!-- div th:replace="~{fragments/nav :: tabs('encrypt')}"></div -->
    <header class="top-nav">
        <nav class="tabs-container">
            <a th:href="@{/encrypt}" class="tab-link">ROT13 Encoder</a>
            <a th:href="@{/substitution}" class="tab-link active">Substitution decoder</a>
            <a th:href="@{/about}" class="tab-link">About</a>
        </nav>
    </header>
    <main class="card">
        <h1>Substitution Decoder</h1>

        <form th:action="@{/substitution}" method="post" th:object="${substitutionCipherForm}" id="cipherForm">
            <div class="input-group">
                <!-- label for="messageInput">Input Message:</label -->
                <textarea id="messageInput" name="originalText" rows="4" placeholder="Your message here..." th:text="${originalText != null ? originalText : ''}"></textarea>
            </div>

            <div class="mapping-section">
                <span class="input-label">Substitution Key (A → Z)</span>
                <div class="substitution-grid">
                    <div th:each="i : ${#numbers.sequence(65, 90)}" class="map-pair"
                         th:with="letter=${T(java.lang.Character).toString(i)}">

                        <span class="map-from" th:text="${letter}">A</span>

                        <input type="text"
                               th:name="|substitutionMap['${letter}']|"
                               th:value="${substitutionCipherForm.substitutionMap != null ? substitutionCipherForm.substitutionMap.get(letter) : ''}"
                               maxlength="1"
                               placeholder="-"
                               autocomplete="off">
                    </div>
                </div>
            </div>
            <button type="submit" id="submitBtn">
                <span class="button-text">Encrypt / Decrypt</span>
                <div class="spinner"></div>
            </button>
            <!-- Added second textarea for the server result -->
            <div class="input-group">
                <!-- label for="resultOutput">Server Result:</label -->
                <textarea id="resultOutput" name="substitutedText" rows="4" placeholder="Server response will appear here..." th:text="${substitutedText != null ? substitutedText : ''}" readonly></textarea>
            </div>

        </form>
    </main>
</body>
</html>
